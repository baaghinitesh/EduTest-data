name: Generate EduTest Content

on:
  schedule:
    # 4 runs daily (IST: 6:00 AM, 11:00 AM, 4:00 PM, 9:00 PM)
    - cron: "30 0 * * *"   # 12:30 AM UTC = 6:00 AM IST
    - cron: "30 5 * * *"   # 5:30 AM UTC  = 11:00 AM IST
    - cron: "30 10 * * *"  # 10:30 AM UTC = 4:00 PM IST
    - cron: "30 15 * * *"  # 3:30 PM UTC  = 9:00 PM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode (leave empty for random)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - full_length_batch
          - subject_batch
          - notes_batch
          - mixed_batch

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run content generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENERATE_MODE: ${{ github.event.inputs.mode }}
        run: |
          cd scripts
          python generate.py

      - name: Commit and push generated content
        run: |
          git config --global user.name "EduTest Bot"
          git config --global user.email "bot@edutest.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "auto: generate content [$TIMESTAMP]"
            git push
          fi
