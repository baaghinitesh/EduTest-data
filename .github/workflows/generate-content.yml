name: Generate EduTest Content

on:
  schedule:
    # 4 runs daily (IST: 6:00 AM, 11:00 AM, 4:00 PM, 9:00 PM)
    - cron: "30 0 * * *"   # 12:30 AM UTC = 6:00 AM IST
    - cron: "30 5 * * *"   # 5:30 AM UTC  = 11:00 AM IST
    - cron: "30 10 * * *"  # 10:30 AM UTC = 4:00 PM IST
    - cron: "30 15 * * *"  # 3:30 PM UTC  = 9:00 PM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Override mode (leave empty for default)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate API keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== API Key Validation ==="
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY — NOT SET (Flash subject tests will be skipped)"
          else
            echo "✅ GEMINI_API_KEY — set (${#GEMINI_API_KEY} chars)"
          fi
          if [ -z "$GEMINI_API_KEY_1" ]; then
            echo "❌ GEMINI_API_KEY_1 — NOT SET (Full-length tests will be skipped)"
          else
            echo "✅ GEMINI_API_KEY_1 — set (${#GEMINI_API_KEY_1} chars)"
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY — NOT SET (Notes and formulas will be skipped)"
          else
            echo "✅ GROQ_API_KEY — set (${#GROQ_API_KEY} chars)"
          fi
          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT — NOT SET (Git push will fail)"
          else
            echo "✅ GH_PAT — set (${#GH_PAT} chars)"
          fi
          echo "=========================="

      - name: Run content generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GENERATE_MODE: ${{ github.event.inputs.mode }}
        run: |
          cd scripts
          python generate.py

      - name: Commit and push generated content
        run: |
          git config --global user.name "EduTest Bot"
          git config --global user.email "bot@edutest.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No new content generated — nothing to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            COUNT=$(git diff --staged --name-only | grep -c "data/admin" || true)
            git commit -m "auto: +${COUNT} content items [$TIMESTAMP]"
            git push
          fi
