name: Generate EduTest Tests

on:
  schedule:
    # 4 runs daily (IST times):
    # UTC 00:30 = 6:00 AM  IST → FULL mode  (UTC hour=0)
    # UTC 06:30 = 12:00 PM IST → SUBJECT mode
    # UTC 11:30 = 5:00  PM IST → SUBJECT mode
    # UTC 15:30 = 9:00  PM IST → SUBJECT mode
    - cron: "30 0  * * *"
    - cron: "30 6  * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: 'full' (full-length) or 'subject' (subject/combined). Leave blank for auto."
        required: false
        default: ""
      exam:
        description: "Force exam slug (e.g. neet-ug, jee-mains, cbse-class-10). Leave blank for random."
        required: false
        default: ""
      backfill:
        description: "Set to 'true' to publish all existing content to MongoDB (one-time backfill)."
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate API keys
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:        ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY2:         ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:           ${{ secrets.GROQ_API_KEY2 }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          EDUTEST_API_URL:         ${{ secrets.EDUTEST_API_URL }}
          EDUTEST_ADMIN_EMAIL:     ${{ secrets.EDUTEST_ADMIN_EMAIL }}
          EDUTEST_ADMIN_PASSWORD:  ${{ secrets.EDUTEST_ADMIN_PASSWORD }}
        run: |
          echo "=== API Key Status ==="
          [ -z "$GEMINI_API_KEY"   ] \
            && echo "❌ GEMINI_API_KEY   (Flash K1 researcher + gen fallback)  — NOT SET" \
            || echo "✅ GEMINI_API_KEY   (Flash K1 researcher + gen fallback)  — ${#GEMINI_API_KEY} chars"
          [ -z "$GEMINI_API_KEY_1" ] \
            && echo "❌ GEMINI_API_KEY_1 (Flash K2 researcher + gen fallback)  — NOT SET" \
            || echo "✅ GEMINI_API_KEY_1 (Flash K2 researcher + gen fallback)  — ${#GEMINI_API_KEY_1} chars"
          [ -z "$GEMINI_API_KEY2"  ] \
            && echo "❌ GEMINI_API_KEY2  (Pro/Flash primary generator)         — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GEMINI_API_KEY2  (Pro/Flash primary generator)         — ${#GEMINI_API_KEY2} chars"
          [ -z "$GROQ_API_KEY"     ] \
            && echo "❌ GROQ_API_KEY     (Groq K1 primary structurer)          — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GROQ_API_KEY     (Groq K1 primary structurer)          — ${#GROQ_API_KEY} chars"
          [ -z "$GROQ_API_KEY2"    ] \
            && echo "❌ GROQ_API_KEY2    (Groq K2 fallback structurer)         — NOT SET" \
            || echo "✅ GROQ_API_KEY2    (Groq K2 fallback structurer)         — ${#GROQ_API_KEY2} chars"
          [ -z "$GH_PAT"           ] \
            && echo "❌ GH_PAT           (git push)                            — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GH_PAT           (git push)                            — ${#GH_PAT} chars"
          [ -z "$EDUTEST_API_URL"  ] \
            && echo "❌ EDUTEST_API_URL  (server publish)                      — NOT SET ⚠️ tests won't appear in app" \
            || echo "✅ EDUTEST_API_URL  (server publish)                      — ${#EDUTEST_API_URL} chars"
          [ -z "$EDUTEST_ADMIN_EMAIL" ] \
            && echo "❌ EDUTEST_ADMIN_EMAIL  (server auth)                     — NOT SET" \
            || echo "✅ EDUTEST_ADMIN_EMAIL  (server auth)                     — set"
          [ -z "$EDUTEST_ADMIN_PASSWORD" ] \
            && echo "❌ EDUTEST_ADMIN_PASSWORD (server auth)                   — NOT SET" \
            || echo "✅ EDUTEST_ADMIN_PASSWORD (server auth)                   — set"
          echo "======================"

      - name: Run test generator
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:        ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY2:         ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:           ${{ secrets.GROQ_API_KEY2 }}
          GENERATE_MODE:           ${{ github.event.inputs.mode }}
          FORCE_EXAM:              ${{ github.event.inputs.exam }}
          EDUTEST_API_URL:         ${{ secrets.EDUTEST_API_URL }}
          EDUTEST_ADMIN_EMAIL:     ${{ secrets.EDUTEST_ADMIN_EMAIL }}
          EDUTEST_ADMIN_PASSWORD:  ${{ secrets.EDUTEST_ADMIN_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            echo "=== BACKFILL MODE: Publishing existing content to MongoDB ==="
            python scripts/backfill_to_server.py
          else
            python scripts/generate.py
          fi

      - name: Commit and push
        run: |
          git config --global user.name  "EduTest Bot"
          git config --global user.email "bot@launchyourconcept.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit — no new content generated"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TEST_COUNT=$(git diff --staged --name-only | grep -c "data/admin/.*/tests/" || true)
            CACHE_COUNT=$(git diff --staged --name-only | grep -c "data/research/" || true)
            MSG="auto: +${TEST_COUNT} test(s)"
            [ "$CACHE_COUNT" -gt 0 ] && MSG="${MSG}, +${CACHE_COUNT} research cache"
            MSG="${MSG} [$TIMESTAMP]"
            git commit -m "$MSG"
            # Pull remote changes first; on conflict accept ours (each run generates unique files)
            if ! git pull --rebase origin master 2>/dev/null; then
              # Rebase conflict — accept our version for all conflicted data files
              git checkout --ours -- .
              git add -A
              git rebase --continue --no-edit || git rebase --skip
            fi
            git push origin HEAD:master
          fi
