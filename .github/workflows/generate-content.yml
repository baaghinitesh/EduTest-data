name: Generate EduTest Tests

on:
  schedule:
    # Split schedule (4 runs/day total: 2 on Render at night + 2 on GitHub Actions in day)
    # Render Free Tier (via external cron → /api/automation/trigger):
    #   2:00 AM IST (20:30 UTC) → SUBJECT mode (1-2 tests)
    #   4:00 AM IST (22:30 UTC) → SUBJECT mode (2h gap, resumes drafts)
    # GitHub Actions (reduced from 4→2 runs/day to stay well under 2,000 free min/month):
    #   UTC 04:30 = 10:00 AM IST → SUBJECT mode (6h gap after 4 AM Render run)
    #   UTC 10:30 =  4:00 PM IST → FULL mode    (post ~1:30 PM IST Gemini RPD reset)
    - cron: "30 4  * * *"
    - cron: "30 10 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: 'full' (full-length) or 'subject' (subject/combined). Leave blank for auto."
        required: false
        default: ""
      exam:
        description: "Force exam slug — any format works: jee, jee-advance, JEE-ADVANCED, neet, cbse-class-10, etc."
        required: false
        default: ""
      instructions:
        description: "Custom generation instructions, e.g. 'Generate JEE Advanced conceptual and reasoning-based questions with PYQs style'. Leave blank for default."
        required: false
        default: ""
      max_tests:
        description: "Max new tests per run (default: 2)"
        required: false
        default: "2"
      backfill:
        description: "Set to 'true' to publish all existing content to MongoDB (one-time backfill)."
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate API keys
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:        ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY2:         ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:           ${{ secrets.GROQ_API_KEY2 }}
          MISTRAL_API_KEY:         ${{ secrets.MISTRAL_API_KEY }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          EDUTEST_API_URL:         ${{ secrets.EDUTEST_API_URL }}
          EDUTEST_ADMIN_EMAIL:     ${{ secrets.EDUTEST_ADMIN_EMAIL }}
          EDUTEST_ADMIN_PASSWORD:  ${{ secrets.EDUTEST_ADMIN_PASSWORD }}
        run: |
          echo "=== API Key Status ==="
          [ -z "$GEMINI_API_KEY"   ] \
            && echo "❌ GEMINI_API_KEY   (Flash K1 researcher + gen fallback)  — NOT SET" \
            || echo "✅ GEMINI_API_KEY   (Flash K1 researcher + gen fallback)  — ${#GEMINI_API_KEY} chars"
          [ -z "$GEMINI_API_KEY_1" ] \
            && echo "❌ GEMINI_API_KEY_1 (Flash K2 researcher + gen fallback)  — NOT SET" \
            || echo "✅ GEMINI_API_KEY_1 (Flash K2 researcher + gen fallback)  — ${#GEMINI_API_KEY_1} chars"
          [ -z "$GEMINI_API_KEY2"  ] \
            && echo "❌ GEMINI_API_KEY2  (Pro/Flash primary generator)         — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GEMINI_API_KEY2  (Pro/Flash primary generator)         — ${#GEMINI_API_KEY2} chars"
          [ -z "$GROQ_API_KEY"     ] \
            && echo "❌ GROQ_API_KEY     (Groq K1 primary structurer)          — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GROQ_API_KEY     (Groq K1 primary structurer)          — ${#GROQ_API_KEY} chars"
          [ -z "$GROQ_API_KEY2"    ] \
            && echo "❌ GROQ_API_KEY2    (Groq K2 fallback structurer)         — NOT SET" \
            || echo "✅ GROQ_API_KEY2    (Groq K2 fallback structurer)         — ${#GROQ_API_KEY2} chars"
          [ -z "$MISTRAL_API_KEY"  ] \
            && echo "⚠️  MISTRAL_API_KEY  (Mistral fallback generator+structurer) — NOT SET (optional)" \
            || echo "✅ MISTRAL_API_KEY  (Mistral fallback generator+structurer) — ${#MISTRAL_API_KEY} chars"
          [ -z "$GH_PAT"           ] \
            && echo "❌ GH_PAT           (git push)                            — NOT SET ⚠️ CRITICAL" \
            || echo "✅ GH_PAT           (git push)                            — ${#GH_PAT} chars"
          [ -z "$EDUTEST_API_URL"  ] \
            && echo "❌ EDUTEST_API_URL  (server publish)                      — NOT SET ⚠️ tests won't appear in app" \
            || echo "✅ EDUTEST_API_URL  (server publish)                      — ${#EDUTEST_API_URL} chars"
          [ -z "$EDUTEST_ADMIN_EMAIL" ] \
            && echo "❌ EDUTEST_ADMIN_EMAIL  (server auth)                     — NOT SET" \
            || echo "✅ EDUTEST_ADMIN_EMAIL  (server auth)                     — set"
          [ -z "$EDUTEST_ADMIN_PASSWORD" ] \
            && echo "❌ EDUTEST_ADMIN_PASSWORD (server auth)                   — NOT SET" \
            || echo "✅ EDUTEST_ADMIN_PASSWORD (server auth)                   — set"
          echo "======================"

      - name: Run test generator
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1:        ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY2:         ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:           ${{ secrets.GROQ_API_KEY2 }}
          MISTRAL_API_KEY:         ${{ secrets.MISTRAL_API_KEY }}
          GENERATE_MODE:           ${{ github.event.inputs.mode }}
          FORCE_EXAM:              ${{ github.event.inputs.exam }}
          GENERATION_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          MAX_TESTS_PER_RUN:       ${{ github.event.inputs.max_tests || '2' }}
          EDUTEST_API_URL:         ${{ secrets.EDUTEST_API_URL }}
          EDUTEST_ADMIN_EMAIL:     ${{ secrets.EDUTEST_ADMIN_EMAIL }}
          EDUTEST_ADMIN_PASSWORD:  ${{ secrets.EDUTEST_ADMIN_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            echo "=== BACKFILL MODE: Publishing existing content to MongoDB ==="
            python scripts/backfill_to_server.py
          else
            # generate.py always exits 0 — even on quota exhaustion —
            # so the commit step always runs and saves any partial content.
            python scripts/generate.py || true
          fi

      - name: Commit and push
        run: |
          git config --global user.name  "EduTest Bot"
          git config --global user.email "bot@launchyourconcept.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit — no new content generated"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TEST_COUNT=$(git diff --staged --name-only | grep -c "data/admin/.*/tests/" || true)
            CACHE_COUNT=$(git diff --staged --name-only | grep -c "data/research/" || true)
            DRAFT_COUNT=$(git diff --staged --name-only | grep -c "data/drafts/" || true)
            MSG="auto: +${TEST_COUNT} test(s)"
            [ "$CACHE_COUNT" -gt 0 ] && MSG="${MSG}, +${CACHE_COUNT} research cache"
            [ "$DRAFT_COUNT" -gt 0 ] && MSG="${MSG}, ${DRAFT_COUNT} draft(s)"
            MSG="${MSG} [$TIMESTAMP]"
            git commit -m "$MSG"
            # Pull remote changes first; on conflict accept ours (each run generates unique files)
            if ! git pull --rebase origin master 2>/dev/null; then
              # Rebase conflict — accept our version for all conflicted data files
              git checkout --ours -- .
              git add -A
              # Use GIT_EDITOR=true to avoid --no-edit flag (not supported in all git versions)
              GIT_EDITOR=true git rebase --continue || git rebase --skip
            fi
            git push origin HEAD:master
          fi
