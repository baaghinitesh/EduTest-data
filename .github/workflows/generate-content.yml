name: Generate EduTest Content

on:
  schedule:
    # 4 runs daily — first run is FULL mode (UTC 00:xx = 5:30 AM IST)
    # Remaining 3 runs are SUBJECT mode
    - cron: "30 0  * * *"   # 12:30 AM UTC = 6:00 AM  IST  → FULL  mode (UTC hour=0)
    - cron: "30 6  * * *"   # 6:30  AM UTC = 12:00 PM IST  → SUBJECT mode
    - cron: "30 11 * * *"   # 11:30 AM UTC = 5:00  PM IST  → SUBJECT mode
    - cron: "30 15 * * *"   # 3:30  PM UTC = 9:00  PM IST  → SUBJECT mode
  workflow_dispatch:
    inputs:
      mode:
        description: "Override mode: 'full' or 'subject' (leave blank for auto)"
        required: false
        default: ""
      exam:
        description: "Force a specific exam slug (e.g. neet-ug, jee-mains, norcet)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate API keys
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GH_PAT:           ${{ secrets.GH_PAT }}
        run: |
          echo "=== API Key Validation ==="
          [ -z "$GEMINI_API_KEY"   ] && echo "❌ GEMINI_API_KEY   — NOT SET (Flash/Researcher missing)" \
                                     || echo "✅ GEMINI_API_KEY   — set (${#GEMINI_API_KEY} chars)"
          [ -z "$GEMINI_API_KEY_1" ] && echo "❌ GEMINI_API_KEY_1 — NOT SET (Pro Generator missing)" \
                                     || echo "✅ GEMINI_API_KEY_1 — set (${#GEMINI_API_KEY_1} chars)"
          [ -z "$GROQ_API_KEY"     ] && echo "❌ GROQ_API_KEY     — NOT SET (Notes/Formulas/Format missing)" \
                                     || echo "✅ GROQ_API_KEY     — set (${#GROQ_API_KEY} chars)"
          [ -z "$GH_PAT"           ] && echo "❌ GH_PAT           — NOT SET (Git push will FAIL)" \
                                     || echo "✅ GH_PAT           — set (${#GH_PAT} chars)"
          echo "=========================="

      - name: Run content generator
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GENERATE_MODE:    ${{ github.event.inputs.mode }}
          FORCE_EXAM:       ${{ github.event.inputs.exam }}
        run: python scripts/generate.py

      - name: Commit and push generated content
        run: |
          git config --global user.name  "EduTest Bot"
          git config --global user.email "bot@edutest.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No new content generated — nothing to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            COUNT=$(git diff --staged --name-only | grep -c "\.json" || true)
            git commit -m "auto: +${COUNT} content items [$TIMESTAMP]"
            git push
          fi
